name: Inventra CD

on:
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/inventra_deploy
          chmod 600 ~/.ssh/inventra_deploy

          ssh \
            -i ~/.ssh/inventra_deploy \
            -p "${{ secrets.VPS_PORT }}" \
            -o StrictHostKeyChecking=no \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            "cd /opt/inventra && git pull origin develop && docker compose up -d --build && docker compose exec -T app php artisan migrate --force"
