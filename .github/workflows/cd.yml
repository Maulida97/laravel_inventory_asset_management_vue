name: Inventra CD

on:
  workflow_run:
    workflows: ["Inventra CI"]
    branches:
      - develop
    types:
      - completed
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}

    steps:
      - name: Download Frontend Build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -n "${{ github.event.workflow_run.id }}" ]; then
            RUN_ID="${{ github.event.workflow_run.id }}"
          else
            RUN_ID=$(gh run list \
              --workflow=ci.yml \
              --branch=develop \
              --status success \
              --limit 1 \
              --json databaseId \
              --jq '.[0].databaseId')

            if [ -z "$RUN_ID" ]; then
              echo "Tidak ada CI run sukses ditemukan"
              exit 1
            fi
          fi

          gh run download "$RUN_ID" \
            --repo Maulida97/laravel_inventory_asset_management_vue \
            --name frontend-build \
            --dir frontend-build

      - name: Deploy to VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -e

          : "${VPS_HOST:?VPS_HOST belum diatur}"
          : "${VPS_PORT:?VPS_PORT belum diatur}"
          : "${VPS_USER:?VPS_USER belum diatur}"
          : "${SSH_PRIVATE_KEY:?SSH_PRIVATE_KEY belum diatur}"

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/inventra_deploy
          chmod 600 ~/.ssh/inventra_deploy

          SSH_OPTIONS=(
            -i ~/.ssh/inventra_deploy
            -p "$VPS_PORT"
            -o StrictHostKeyChecking=no
            -o IdentitiesOnly=yes
          )

          # 1. Update source code & bersihkan build lama
          ssh "${SSH_OPTIONS[@]}" "$VPS_USER@$VPS_HOST" 'bash -s' <<'REMOTE'
            set -e
            cd /opt/inventra

            git fetch origin
            git checkout develop
            git reset --hard origin/develop

            rm -rf public/build
            mkdir -p public/build
          REMOTE

          # 2. Upload frontend build dari CI artifact
          scp \
            -i ~/.ssh/inventra_deploy \
            -P "$VPS_PORT" \
            -o StrictHostKeyChecking=no \
            -o IdentitiesOnly=yes \
            -r frontend-build/. \
            "$VPS_USER@$VPS_HOST:/opt/inventra/public/build/"

          # 3. Docker dan Laravel
          ssh "${SSH_OPTIONS[@]}" "$VPS_USER@$VPS_HOST" 'bash -s' <<'REMOTE'
            set -e
            cd /opt/inventra

            docker compose up -d --build

            docker compose exec -T app composer install --no-dev --optimize-autoloader

            docker compose exec -T app php artisan migrate --force

            docker compose exec -T app php artisan optimize:clear
            docker compose exec -T app php artisan optimize
          REMOTE
