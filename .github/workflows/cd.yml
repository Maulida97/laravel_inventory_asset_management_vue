name: Inventra CD Test

on:
  workflow_dispatch:

jobs:
  test-ssh:
    name: Test SSH to VPS
    runs-on: ubuntu-latest

    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/inventra_deploy
          chmod 600 ~/.ssh/inventra_deploy

      - name: Test SSH Connection
        run: |
          ssh \
            -i ~/.ssh/inventra_deploy \
            -p "${{ secrets.VPS_PORT }}" \
            -o StrictHostKeyChecking=no \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            "whoami"
