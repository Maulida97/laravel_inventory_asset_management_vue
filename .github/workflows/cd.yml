name: Inventra CD

on:
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/inventra_deploy
          chmod 600 ~/.ssh/inventra_deploy

          ssh \
            -i ~/.ssh/inventra_deploy \
            -p "${{ secrets.VPS_PORT }}" \
            -o StrictHostKeyChecking=no \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            "
              set -e

              # Clone jika belum ada, pull jika sudah ada
              if [ ! -d /opt/inventra/.git ]; then
                git clone https://github.com/Maulida97/laravel_inventory_asset_management_vue.git /opt/inventra
              fi

              cd /opt/inventra
              git fetch origin
              git checkout develop
              git reset --hard origin/develop

              # Copy .env jika belum ada
              if [ ! -f .env ]; then
                cp .env.example .env
              fi

              docker compose up -d --build
              docker compose exec -T app php artisan migrate --force
            "
