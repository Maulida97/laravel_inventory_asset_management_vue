server {
    listen 80;
    server_name localhost;
    root /var/www/html/public;

    index index.php index.html;
    charset utf-8;

    # Limit Upload Payload (untuk upload foto aset & lampiran dokumen)
    client_max_body_size 50M;

    # Security Headers Dasar
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Laravel URL Routing
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Asset Log Optimization
    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # Error Page Handling ke Laravel Router
    error_page 404 /index.php;

    # PHP-FPM FastCGI Handler
    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        
        # Sembunyikan versi PHP demi keamanan
        fastcgi_hide_header X-Powered-By;
        
        # Timeout untuk proses berdurasi panjang
        fastcgi_read_timeout 300;
        fastcgi_connect_timeout 300;
        fastcgi_send_timeout 300;
    }

    # Sembunyikan file tersembunyi (.htaccess, .env, .git, dll)
    location ~ /\.(?!well-known).* {
        deny all;
    }
}